# Bundled minimal tmux configuration used on the dedicated Ensemble socket.
# The user's own ~/.tmux.conf is never loaded for this server.
set -g mouse on
set -g history-limit 50000
set -g remain-on-exit on
set -g window-size latest
set -g aggressive-resize on
set -g default-terminal "tmux-256color"
set -s escape-time 0
set -g status off
set -s exit-unattached off
set -s exit-empty on
